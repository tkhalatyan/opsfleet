# x86 on On-Demand capacity: for workloads that must not be interrupted by
# Spot reclaims (e.g. long-running jobs, single-replica stateful services).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-amd64-on-demand
  labels:
    app: demo-amd64-on-demand
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-amd64-on-demand
  template:
    metadata:
      labels:
        app: demo-amd64-on-demand
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/capacity-type: on-demand
      containers:
        - name: app
          image: public.ecr.aws/docker/library/busybox:stable
          command: ["sh", "-c", "while true; do echo \"arch=$(uname -m) node=$NODE_NAME\"; sleep 30; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 256Mi
